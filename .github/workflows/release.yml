name: Build signed release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.2.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: starclip-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Check the version and existing tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node scripts/version.mjs check "$RELEASE_TAG")
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { releaseNotes } from "./scripts/release-manifest.mjs"; releaseNotes(readFileSync("CHANGELOG.md", "utf8"), process.env.RELEASE_TAG.slice(1));'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npm run tauri icon public/starclip.svg
      - name: Test desktop permissions, updater and CLI transport
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test ai_stdio
      - name: Verify native font downloads and offline rendering
        id: fonts
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p artifacts
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib handwriting::tests::official_fonts_download_then_render_offline -- --ignored --exact --nocapture 2>&1 | tee artifacts/handwriting-integration.log
          echo '- Native font catalog download, hash checks and offline CPU rendering passed with original fixed text. This is not a GUI export check.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failed font-check evidence
        if: failure() && steps.fonts.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: release-font-failure-${{ matrix.target }}
          path: |
            artifacts/handwriting-integration.log
            artifacts/handwriting-fonts/*-native.png
          retention-days: 7
          if-no-files-found: warn
      - name: Build installer and signed Tauri updater artifact
        env:
          STARCLIP_TELEMETRY_ENDPOINT: ${{ vars.STARCLIP_TELEMETRY_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret.' >&2
            exit 1
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          npm run tauri build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Test the packaged release CLI and MCP transport
        timeout-minutes: 5
        run: |
          binary="$PWD/src-tauri/target/${{ matrix.target }}/release/starclip"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          if [ "$RUNNER_OS" = macOS ]; then binary="$PWD/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Starclip.app/Contents/MacOS/starclip"; fi
          STARCLIP_TEST_BINARY="$binary" cargo test --locked --manifest-path src-tauri/Cargo.toml --test ai_stdio
      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict 'src-tauri/target/${{ matrix.target }}/release/bundle/macos/Starclip.app'
      - name: Collect the complete platform artifact set
        run: node scripts/release-manifest.mjs collect 'src-tauri/target/${{ matrix.target }}/release/bundle' release-assets '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
  installers:
    needs: [validate, desktop]
    uses: ./.github/workflows/installer-smoke.yml
    permissions:
      contents: read
      actions: read
    with:
      revision: ${{ needs.validate.outputs.revision }}
      version: ${{ needs.validate.outputs.version }}
      windows-artifact: release-windows-x86_64
      macos-artifact: release-darwin-aarch64
  draft:
    needs: [validate, desktop, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded
      - name: Install the signature verifier
        run: |
          set -euo pipefail
          url=https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          sha=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
          if curl -fsSL --retry 5 --retry-all-errors -o /tmp/minisign.tgz "$url" && echo "$sha  /tmp/minisign.tgz" | sha256sum -c -; then
            tar xzf /tmp/minisign.tgz -C /tmp
            sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          else
            sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install --yes -o Acquire::Retries=5 minisign
          fi
          minisign -v
      - name: Verify both platforms and assemble the update feed
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: node scripts/release-manifest.mjs assemble downloaded release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: complete-release-${{ needs.validate.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
      - name: Create or reuse a draft, never overwrite a public release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const body = fs.readFileSync('release-assets/release-notes.md', 'utf8');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) throw new Error('Refusing to overwrite a published release. Bump the version.');
            if (release) {
              await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, name: `星笺 ${tag}`, body, draft: true, prerelease: false });
            } else {
              await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, target_commitish: process.env.RELEASE_REVISION, name: `星笺 ${tag}`, body, draft: true, prerelease: false });
            }
      - name: Upload verified files to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          echo 'Draft assembled. Review and test both platforms before manually publishing it as the latest release.' >> "$GITHUB_STEP_SUMMARY"
