name: Windows signed updater acceptance
# Installed clients through 0.2.5 read the separate cpython666/starclip compatibility manifest.
# The signed organization latest.json keeps StarDreamTech/starclip download URLs.
# The fixture rewrites only that compatibility response at runtime and serves the same package bytes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published release tag, for example v0.2.6'
        required: true
        default: v0.2.6
        type: string
      release-run-id:
        description: 'Successful release.yml run whose head is the tag or a descendant that does not change application source'
        required: true
        type: string
      baseline:
        description: 'Genuine public Windows baseline'
        required: true
        default: public-0.2.5
        type: choice
        options: [public-0.2.5, public-0.2.4, public-0.2.3, public-0.2.2]
permissions:
  contents: read
  actions: read
jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The release run head may equal the tag, or the tag may be its ancestor
      # when compare only changes .github/, docs/ or .agents/. Checked-out
      # source stays the tag. Package sha256 is checked after download.
      - name: Bind the release run to the published tag
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ inputs.release-run-id }}
        run: node scripts/release-run-binding.mjs bind --tag "$TARGET_TAG" --run-id "$RELEASE_RUN_ID" --output "$RUNNER_TEMP/starclip-release-binding.json"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.head-sha }}
          path: release-source
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.target.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ steps.target.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/starclip-signed-target
      - name: Require downloaded packages to match the published release sha256
        shell: bash
        run: node scripts/release-run-binding.mjs verify-assets --binding "$RUNNER_TEMP/starclip-release-binding.json" --assets "$RUNNER_TEMP/starclip-signed-target"
      - name: Download and pin the selected genuine public baseline before isolating HTTPS
        shell: pwsh
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          python scripts/updater_baselines.py download --origin $env:BASELINE --platform windows-x86_64 --package "$env:RUNNER_TEMP/starclip-baseline-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The genuine public baseline download or pinned digest check failed.' }
      - name: Prepare the private HTTPS fixture without changing signed package bytes
        shell: pwsh
        env:
          TARGET_TAG: ${{ inputs.tag }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          TARGET_HEAD: ${{ steps.target.outputs.head-sha }}
          RELEASE_RUN_ID: ${{ steps.target.outputs.run-id }}
        run: |
          $tokens = $null; $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-updater-acceptance.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          if (!(Get-Command openssl -ErrorAction SilentlyContinue)) {
            $opensslDir = 'C:\Program Files\Git\usr\bin'
            if (!(Test-Path -LiteralPath (Join-Path $opensslDir 'openssl.exe'))) { throw 'OpenSSL is unavailable.' }
            $env:PATH = "$opensslDir;$env:PATH"
          }
          python scripts/release-updater-fixture.py prepare --assets "$env:RUNNER_TEMP/starclip-signed-target" --output "$env:RUNNER_TEMP/starclip-updater-private" --version $env:TARGET_VERSION --source-ref $env:TARGET_TAG --release-run-id $env:RELEASE_RUN_ID --source-head-sha $env:TARGET_HEAD --platform windows-x86_64 --source-directory "$env:GITHUB_WORKSPACE/release-source" --published-binding "$env:RUNNER_TEMP/starclip-release-binding.json"
          if ($LASTEXITCODE -ne 0) { throw 'Signed update fixture preparation failed.' }
      - name: Exercise the genuine public baseline to signed target through native UI and trusted HTTPS
        timeout-minutes: 12
        shell: pwsh
        env:
          TARGET_HEAD: ${{ steps.target.outputs.head-sha }}
          RELEASE_RUN_ID: ${{ steps.target.outputs.run-id }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          ./scripts/windows-updater-acceptance.ps1 -BaselineInstaller "$env:RUNNER_TEMP/starclip-baseline-setup.exe" -BaselineOrigin $env:BASELINE -FixtureDirectory "$env:RUNNER_TEMP/starclip-updater-private" -RepositoryRoot $env:GITHUB_WORKSPACE -SourceHeadSha $env:TARGET_HEAD -ReleaseRunId $env:RELEASE_RUN_ID
      - name: Retain only synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-updater-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/starclip-windows-updater-evidence/*
          if-no-files-found: warn
          retention-days: 7
